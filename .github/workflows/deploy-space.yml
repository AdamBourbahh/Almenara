name: Deploy to Hugging Face Space

# Runs after the Verify workflow succeeds on main, or manually. It is skipped until the
# repository variables HF_SPACE and HF_DATA_REPO and the secret HF_TOKEN are configured.
on:
  workflow_run:
    workflows: [Verify]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-space
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      vars.HF_SPACE != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r deploy/requirements.txt
      - run: python deploy/publish.py space --repo "$HF_SPACE" --data-repo "$HF_DATA_REPO" --wait
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
          HF_DATA_REPO: ${{ vars.HF_DATA_REPO }}
