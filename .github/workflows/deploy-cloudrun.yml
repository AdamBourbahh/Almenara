name: Deploy to Cloud Run

on:
  workflow_run:
    workflows: [Verify]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudrun
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: >-
      vars.GCP_PROJECT != '' && vars.GCP_WIF_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != '' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GCP_PROJECT: ${{ vars.GCP_PROJECT }}
      DATA_REPO: ${{ vars.HF_DATA_REPO || 'andearlla/firms-harmonizer-data' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime data downloader
        run: python -m pip install -r deploy/requirements.txt
      - name: Bundle published real data before building the image
        run: >-
          hf download "$DATA_REPO" --repo-type dataset --local-dir firms-harmonizer/data
          --include "processed/**" "lookup/**" "cache/land_cover/**" "manifest.json"
      - name: Deploy the verified main commit
        run: |
          current=$(git rev-parse HEAD)
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$current" != "$latest" ]; then
            echo "Skipping superseded main commit $current"
            exit 0
          fi
          python deploy/cloudrun.py --project "$GCP_PROJECT" deploy --data-repo "$DATA_REPO"
