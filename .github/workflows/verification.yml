name: Verify
on: [push, pull_request]
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: firms-harmonizer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: firms-harmonizer/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: firms-harmonizer/frontend/package-lock.json
      - run: python -m pip install -r requirements.lock
      - run: npm ci --prefix frontend
      - run: python scripts/run_pipeline.py etl
      - run: python scripts/00_bootstrap_synthetic_cube.py
      - run: python -m pytest backend/tests -q
      - run: python scripts/verify_frozen_tests.py
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
